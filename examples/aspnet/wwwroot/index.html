<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><link rel="icon" href="data:," /><title>PDF Editor SDK — ASP.NET host</title></head>
  <body>
    <p id="saveStatus">Cargando documento de demostración…</p>
    <button id="reopen" type="button" disabled>Reabrir última versión guardada</button>
    <div id="structuralToolbar" aria-label="Operaciones estructurales">
      <button data-operation="watermark" type="button">Marca de agua</button>
      <button data-operation="numbering" type="button">Numerar páginas</button>
      <button data-operation="rotate" type="button">Rotar página</button>
      <button data-operation="blank" type="button">Insertar página</button>
      <button data-operation="annotate" type="button">Añadir anotación</button>
      <button data-operation="redact" type="button">Censurar</button>
      <button data-operation="attachment" type="button">Adjuntar evidencia</button>
      <button data-operation="link" type="button">Añadir enlace</button>
      <button data-operation="forms" type="button">Inspeccionar formularios</button>
      <button data-operation="image" type="button">Insertar imagen</button>
      <button data-operation="header" type="button">Encabezado y pie</button>
      <button data-operation="bookmarks" type="button">Crear bookmarks</button>
      <button data-operation="inspect" type="button">Inspeccionar elementos</button>
      <button data-operation="remove-attachment" type="button">Eliminar primer adjunto</button>
    </div>
    <canvas id="signature" width="320" height="90" aria-label="Firma manuscrita"></canvas>
    <button id="apply-signature" type="button">Insertar firma manuscrita</button>
    <enterprise-pdf-editor id="pdfEditor"></enterprise-pdf-editor>
    <script type="module" src="/sdk/pdf-editor.js"></script>
    <script type="module">
      import { createDemoPdf } from "/demo-pdf.js";
      import { structuralPdfEngine } from "/sdk/structural/structural-engine.js";

      await customElements.whenDefined("enterprise-pdf-editor");
      const editor = document.querySelector("#pdfEditor");
      const status = document.querySelector("#saveStatus");
      const reopen = document.querySelector("#reopen");
      let savedContent;
      let currentContent;
      let revision = 1;
      const toBlob = (bytes) => new Blob([new Uint8Array(bytes).buffer], { type: "application/pdf" });
      async function applyStructural(label, action) {
        try {
          const engine = await structuralPdfEngine.open(currentContent);
          await action(engine);
          currentContent = toBlob(await engine.save({ compressed: true }));
          revision += 1;
          editor.document = { descriptor: { id: "demo", name: `demo-v${revision}.pdf`, version: String(revision) }, content: currentContent };
          status.textContent = `${label} aplicada · ${currentContent.size} bytes`;
        } catch (error) {
          status.textContent = `${label} no disponible: ${error.message}`;
        }
      }
      document.querySelectorAll("#structuralToolbar [data-operation]").forEach((button) => button.addEventListener("click", () => {
        const op = button.dataset.operation;
        if (op === "watermark") return applyStructural("Marca de agua", (e) => e.addTextWatermark("CONFIDENCIAL"));
        if (op === "numbering") return applyStructural("Numeración", (e) => e.addPageNumbers("Página {page}/{total}"));
        if (op === "rotate") return applyStructural("Rotación", (e) => e.rotatePages([0], 90));
        if (op === "blank") return applyStructural("Inserción", (e) => e.insertBlankPage(1));
        if (op === "annotate") return editor.getOperations().then((ops) => ops.addAnnotation({ id: crypto.randomUUID(), pageIndex: 0, subtype: "highlight", rect: { origin: { x: 48, y: 700 }, size: { width: 220, height: 28 } }, contents: "Anotación de demostración", color: "#ffcc00", opacity: 0.6 })).then(() => { status.textContent = "Anotación añadida · pulsa Guardar"; }).catch((error) => { status.textContent = `Anotación no disponible: ${error.message}`; });
        if (op === "attachment") return editor.getOperations().then((ops) => ops.addAttachment(new Blob(["evidence from aspnet"], { type: "text/plain" }), "evidence.txt", "UI evidence")).then(() => { status.textContent = "Adjunto añadido · pulsa Guardar"; }).catch((error) => { status.textContent = `Adjunto no disponible: ${error.message}`; });
        if (op === "link") return editor.getOperations().then((ops) => ops.addLink({ id: crypto.randomUUID(), pageIndex: 0, rect: { origin: { x: 48, y: 650 }, size: { width: 180, height: 24 } }, target: { kind: "url", url: "https://example.com" } })).then(() => { status.textContent = "Enlace externo añadido · pulsa Guardar"; }).catch((error) => { status.textContent = `Enlace no disponible: ${error.message}`; });
        if (op === "forms") return editor.getOperations().then((ops) => ops.listFormFields()).then((fields) => { status.textContent = `Campos AcroForm detectados: ${fields.length}`; }).catch((error) => { status.textContent = `Formularios no disponibles: ${error.message}`; });
        if (op === "image") return applyStructural("Imagen", async (e) => { const pixel = Uint8Array.from(atob("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="), (c) => c.charCodeAt(0)); await e.insertImage(pixel, 0, { x: 480, y: 700, width: 48, height: 48 }, "image/png"); });
        if (op === "header") return applyStructural("Encabezado y pie", (e) => e.addHeaderFooter("Enterprise PDF Editor", "Página {page}"));
        if (op === "bookmarks") return applyStructural("Bookmarks", (e) => e.setBookmarks([{ title: "Inicio", pageIndex: 0 }, { title: "Contenido", pageIndex: Math.min(1, e.pageCount - 1) }]));
        if (op === "inspect") return editor.getOperations().then(async (ops) => { const [annotations, links, attachments] = await Promise.all([ops.listAnnotations(), ops.listLinks(), ops.listAttachments()]); status.textContent = `Elementos: ${annotations.length} anotaciones · ${links.length} enlaces · ${attachments.length} adjuntos`; }).catch((error) => { status.textContent = `Inspección no disponible: ${error.message}`; });
        if (op === "remove-attachment") return editor.getOperations().then(async (ops) => { const attachments = await ops.listAttachments(); if (!attachments.length) { status.textContent = "No hay adjuntos para eliminar"; return; } await ops.removeAttachment(attachments[0].id); status.textContent = `Adjunto eliminado: ${attachments[0].name} · pulsa Guardar`; }).catch((error) => { status.textContent = `Eliminación no disponible: ${error.message}`; });
        if (op === "redact") return editor.getOperations().then(async (ops) => { await ops.markRedaction({ id: crypto.randomUUID(), pageIndex: 0, rect: { origin: { x: 48, y: 700 }, size: { width: 220, height: 28 } }, text: "PDF Editor SDK" }); const result = await ops.commitRedactions(); status.textContent = result.committed ? "Censura aplicada irreversiblemente · pulsa Guardar" : "Censura pendiente"; }).catch((error) => { status.textContent = `Censura no disponible: ${error.message}`; });
      }));
      const signatureCanvas = document.querySelector("#signature");\n      const signatureContext = signatureCanvas.getContext("2d");\n      signatureContext.lineWidth = 3; signatureContext.strokeStyle = "#173b70"; signatureContext.beginPath(); signatureContext.moveTo(20, 60); signatureContext.bezierCurveTo(80, 10, 130, 85, 210, 35); signatureContext.stroke(); signatureContext.font = "16px sans-serif"; signatureContext.fillText("Firma demo", 220, 70);\n      document.querySelector("#apply-signature").addEventListener("click", async () => { const blob = await new Promise((resolve) => signatureCanvas.toBlob(resolve, "image/png")); if (!blob) return; await applyStructural("Firma manuscrita visual", async (e) => e.insertImage(new Uint8Array(await blob.arrayBuffer()), 0, { x: 48, y: 580, width: 180, height: 50 }, "image/png")); });\n      editor.persistenceProvider = {
        async save(request) {
          savedContent = request.content;
          status.textContent = `Guardado ${request.content.size} bytes · SHA-256 ${request.sha256.slice(0, 12)}…`;
          reopen.disabled = false;
          return { descriptor: { ...request.descriptor, version: String(Number(request.descriptor.version ?? "1") + 1) } };
        },
      };
      editor.addEventListener("pdf-saved", () => {
        status.textContent += " · Persistencia confirmada";
      });
      reopen.addEventListener("click", () => {
        if (!savedContent) return;
        editor.document = {
          descriptor: { id: "demo", name: "demo-reopened.pdf", version: "2" },
          content: savedContent,
        };
        status.textContent += " · Reabierto desde el contenido guardado";
      });
      editor.document = {
        descriptor: { id: "demo", name: "demo.pdf", version: "1" },
        content: (currentContent = createDemoPdf()),
      };
      status.textContent = "Documento cargado · listo para anotar y guardar";
    </script>
  </body>
</html>
